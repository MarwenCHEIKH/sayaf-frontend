<div [class.fullscreen]="isMapMode">
  <button
    (click)="toggleMode()"
    class="mode-toggle"
    [class.map-mode]="isMapMode"
  >
    {{ isMapMode ? "✕" : "Map Mode" }}
  </button>

  <app-listings-map-container *ngIf="isMapMode"></app-listings-map-container>
  <app-list-listings *ngIf="!isMapMode"> </app-list-listings>
</div>
