<div class="auth-page">
  <div class="auth-container register-container">
    <h2>Register</h2>
    <form (ngSubmit)="onRegister()">
      <input
        type="text"
        [(ngModel)]="name"
        name="name"
        placeholder="Full Name"
        required
      />
      <input
        type="email"
        [(ngModel)]="email"
        name="email"
        placeholder="Email"
        required
      />
      <input
        type="password"
        [(ngModel)]="password"
        name="password"
        placeholder="Password"
        required
      />
      <button type="submit">Register</button>
    </form>
    <p>Already have an account? <a routerLink="/login">Login</a></p>
  </div>
</div>
