<div class="auth-page">
  <div class="auth-container">
    <h2>Login</h2>
    <form (ngSubmit)="onLogin()">
      <input
        type="email"
        [(ngModel)]="email"
        name="email"
        placeholder="Email"
        required
      />
      <input
        type="password"
        [(ngModel)]="password"
        name="password"
        placeholder="Password"
        required
      />
      <button type="submit">Login</button>
    </form>
    <p>Don’t have an account? <a routerLink="/register">Register</a></p>
  </div>
</div>
