<div class="listings-map-container">
  <!-- Desktop layout -->
  <div class="desktop-layout" [class.mobile-hidden]="isMobile()">
    <div class="listings-panel" (scroll)="onScroll($event)">
      <app-listings
        [isMobileView]="false"
        [listings]="displayedListings()"
        [loading]="loading()"
        [selectedId]="selectedId()"
        [hasMore]="hasMore()"
        (listingClick)="onListingClick($event)"
        (loadMore)="onLoadMore()"
        (searchChange)="onSearchChange($event)"
        (typeFilterChange)="onTypeFilterChange($event)"
        (sortChange)="onSortChange($event)"
        (reviewScoreChange)="onReviewScoreChange($event)"
      />
    </div>

    <div class="map-panel">
      <app-map
        [markers]="markers()"
        [selectedMarkerId]="selectedId()"
        [center]="mapCenter()"
        [zoom]="13"
        [interactive]="true"
        [enableClustering]="true"
        (mapMoved)="onMapMoved($event)"
        (markerClicked)="onMarkerClick($event)"
      />
    </div>
  </div>

  <!-- Mobile layout -->
  <div class="mobile-layout" [class.desktop-hidden]="!isMobile()">
    <!-- Fixed Map Section (Top 50vh) -->
    <div class="mobile-map-fixed">
      <app-map
        [markers]="markers()"
        [selectedMarkerId]="selectedId()"
        [center]="mapCenter()"
        [zoom]="13"
        [interactive]="true"
        [enableClustering]="true"
        (mapMoved)="onMapMoved($event)"
        (markerClicked)="onMarkerClick($event)"
      />
    </div>

    <!-- Scrollable Content Section (Bottom 50vh) -->
    <div class="mobile-content-scrollable" (scroll)="onScroll($event)">
      <app-listings
        [isMobileView]="true"
        [listings]="displayedListings()"
        [loading]="loading()"
        [selectedId]="selectedId()"
        [hasMore]="hasMore()"
        (listingClick)="onListingClick($event)"
        (loadMore)="onLoadMore()"
        (searchChange)="onSearchChange($event)"
        (typeFilterChange)="onTypeFilterChange($event)"
        (sortChange)="onSortChange($event)"
        (reviewScoreChange)="onReviewScoreChange($event)"
      />
    </div>
  </div>
</div>
