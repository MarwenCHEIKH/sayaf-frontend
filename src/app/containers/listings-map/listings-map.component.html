<div class="listings-map-container">
  <!-- Desktop layout -->
  <div class="desktop-layout" [class.mobile-hidden]="isMobile()">
    <div class="listings-panel" (scroll)="onScroll($event)">
      <app-listings
        [isMobileView]="false"
        [listings]="displayedListings()"
        [loading]="loading()"
        [selectedId]="selectedId()"
        [hasMore]="hasMore()"
        (listingClick)="onListingClick($event)"
        (loadMore)="onLoadMore()"
        (searchChange)="onSearchChange($event)"
        (typeFilterChange)="onTypeFilterChange($event)"
        (sortChange)="onSortChange($event)"
        (reviewScoreChange)="onReviewScoreChange($event)"
      />
    </div>

    <div class="map-panel">
      <!-- Search as map moves toggle -->
      <div class="map-controls">
        <button
          class="search-toggle"
          [class.active]="searchAsMapMoves()"
          (click)="toggleSearchAsMapMoves()"
          type="button"
        >
          <svg
            class="checkbox-icon"
            width="18"
            height="18"
            viewBox="0 0 18 18"
            [attr.aria-label]="searchAsMapMoves() ? 'Checked' : 'Unchecked'"
          >
            <rect
              x="1"
              y="1"
              width="16"
              height="16"
              rx="3"
              [attr.fill]="searchAsMapMoves() ? '#222222' : 'white'"
              [attr.stroke]="searchAsMapMoves() ? '#222222' : '#B0B0B0'"
              stroke-width="2"
            />
            <path
              *ngIf="searchAsMapMoves()"
              d="M5 9l3 3 5-6"
              stroke="white"
              stroke-width="2"
              fill="none"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
          <span class="toggle-text">Search as map moves</span>
        </button>
      </div>

      <app-map
        [markers]="markers()"
        [selectedMarkerId]="selectedId()"
        [center]="mapCenter()"
        [zoom]="13"
        [interactive]="true"
        [enableClustering]="true"
        (mapMoved)="onMapMoved($event)"
        (markerClicked)="onMarkerClick($event)"
      />
    </div>
  </div>

  <!-- Mobile layout -->
  <div class="mobile-layout" [class.desktop-hidden]="!isMobile()">
    <!-- Fixed Map Section (Top 50vh) -->
    <div class="mobile-map-fixed">
      <!-- Search as map moves toggle -->
      <div class="map-controls">
        <button
          class="search-toggle"
          [class.active]="searchAsMapMoves()"
          (click)="toggleSearchAsMapMoves()"
          type="button"
        >
          <svg
            class="checkbox-icon"
            width="18"
            height="18"
            viewBox="0 0 18 18"
            [attr.aria-label]="searchAsMapMoves() ? 'Checked' : 'Unchecked'"
          >
            <rect
              x="1"
              y="1"
              width="16"
              height="16"
              rx="3"
              [attr.fill]="searchAsMapMoves() ? '#222222' : 'white'"
              [attr.stroke]="searchAsMapMoves() ? '#222222' : '#B0B0B0'"
              stroke-width="2"
            />
            <path
              *ngIf="searchAsMapMoves()"
              d="M5 9l3 3 5-6"
              stroke="white"
              stroke-width="2"
              fill="none"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
          <span class="toggle-text">Search as map moves</span>
        </button>
      </div>

      <app-map
        [markers]="markers()"
        [selectedMarkerId]="selectedId()"
        [center]="mapCenter()"
        [zoom]="13"
        [interactive]="true"
        [enableClustering]="true"
        (mapMoved)="onMapMoved($event)"
        (markerClicked)="onMarkerClick($event)"
      />
    </div>

    <!-- Scrollable Content Section (Bottom 50vh) -->
    <div class="mobile-content-scrollable" (scroll)="onScroll($event)">
      <app-listings
        [isMobileView]="true"
        [listings]="displayedListings()"
        [loading]="loading()"
        [selectedId]="selectedId()"
        [hasMore]="hasMore()"
        (listingClick)="onListingClick($event)"
        (loadMore)="onLoadMore()"
        (searchChange)="onSearchChange($event)"
        (typeFilterChange)="onTypeFilterChange($event)"
        (sortChange)="onSortChange($event)"
        (reviewScoreChange)="onReviewScoreChange($event)"
      />
    </div>
  </div>
</div>
