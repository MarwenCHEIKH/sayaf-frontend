<div class="listings-map-container">
  <!-- Desktop layout -->
  <div class="desktop-layout" *ngIf="!isMobile()">
    <div class="listings-panel" (scroll)="onScroll($event)">
      <app-listings
        [isMobileView]="false"
        [listings]="displayedListings()"
        [loading]="loading()"
        [selectedId]="selectedId()"
        [hasMore]="hasMore()"
        (listingClick)="onListingClick($event)"
        (loadMore)="onLoadMore()"
        (searchChange)="onSearchChange($event)"
        (typeFilterChange)="onTypeFilterChange($event)"
        (sortChange)="onSortChange($event)"
        (reviewScoreChange)="onReviewScoreChange($event)"
      />
    </div>

    <div class="map-panel">
      <!-- Map controls -->
      <div class="map-controls">
        <button
          class="search-toggle"
          [class.active]="searchAsMapMoves()"
          (click)="toggleSearchAsMapMoves()"
          type="button"
        >
          <svg
            class="checkbox-icon"
            width="18"
            height="18"
            viewBox="0 0 18 18"
            [attr.aria-label]="searchAsMapMoves() ? 'Checked' : 'Unchecked'"
          >
            <rect
              x="1"
              y="1"
              width="16"
              height="16"
              rx="3"
              [attr.fill]="searchAsMapMoves() ? '#222222' : 'white'"
              [attr.stroke]="searchAsMapMoves() ? '#222222' : '#B0B0B0'"
              stroke-width="2"
            />
            <path
              *ngIf="searchAsMapMoves()"
              d="M5 9l3 3 5-6"
              stroke="white"
              stroke-width="2"
              fill="none"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
          <span class="toggle-text">Search as map moves</span>
        </button>
      </div>

      <!-- Tier indicator -->
      @if (searchAsMapMoves() && currentTier()) {
      <div class="tier-indicator">
        <span class="tier-badge">{{ currentTier() }}</span>
        @if (currentTier() === 'COUNTRY' || currentTier() === 'STATE') {
        <span class="tier-hint">Zoom in to see individual listings</span>
        }
      </div>
      }

      <!-- SINGLE MAP INSTANCE - Shared between desktop and mobile -->
      <div class="map-wrapper">
        <app-map
          #mapComponent
          [markers]="markers()"
          [clusters]="clusters()"
          [selectedMarkerId]="selectedId()"
          [center]="mapCenter()"
          [zoom]="13"
          [interactive]="true"
          [enableClustering]="true"
          (mapMoved)="onMapMoved($event)"
          (markerClicked)="onMarkerClick($event)"
          (clusterClicked)="onClusterClick($event)"
        />
      </div>
    </div>
  </div>

  <!-- Mobile layout -->
  <div class="mobile-layout" *ngIf="isMobile()">
    <!-- Fixed Map Section (Top 50vh) -->
    <div class="mobile-map-container">
      <!-- Map controls -->
      <div class="map-controls">
        <button
          class="search-toggle"
          [class.active]="searchAsMapMoves()"
          (click)="toggleSearchAsMapMoves()"
          type="button"
        >
          <svg
            class="checkbox-icon"
            width="18"
            height="18"
            viewBox="0 0 18 18"
            [attr.aria-label]="searchAsMapMoves() ? 'Checked' : 'Unchecked'"
          >
            <rect
              x="1"
              y="1"
              width="16"
              height="16"
              rx="3"
              [attr.fill]="searchAsMapMoves() ? '#222222' : 'white'"
              [attr.stroke]="searchAsMapMoves() ? '#222222' : '#B0B0B0'"
              stroke-width="2"
            />
            <path
              *ngIf="searchAsMapMoves()"
              d="M5 9l3 3 5-6"
              stroke="white"
              stroke-width="2"
              fill="none"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
          <span class="toggle-text">Search as map moves</span>
        </button>
      </div>

      <!-- Tier indicator -->
      @if (searchAsMapMoves() && currentTier()) {
      <div class="tier-indicator mobile">
        <span class="tier-badge">{{ currentTier() }}</span>
      </div>
      }

      <!-- SAME MAP INSTANCE - Reused from desktop -->
      <div class="map-wrapper">
        <app-map
          #mapComponent
          [markers]="markers()"
          [clusters]="clusters()"
          [selectedMarkerId]="selectedId()"
          [center]="mapCenter()"
          [zoom]="13"
          [interactive]="true"
          [enableClustering]="true"
          (mapMoved)="onMapMoved($event)"
          (markerClicked)="onMarkerClick($event)"
          (clusterClicked)="onClusterClick($event)"
        />
      </div>
    </div>

    <!-- Scrollable Content Section (Bottom 50vh) -->
    <div class="mobile-content-scrollable" (scroll)="onScroll($event)">
      <app-listings
        [isMobileView]="true"
        [listings]="displayedListings()"
        [loading]="loading()"
        [selectedId]="selectedId()"
        [hasMore]="hasMore()"
        (listingClick)="onListingClick($event)"
        (loadMore)="onLoadMore()"
        (searchChange)="onSearchChange($event)"
        (typeFilterChange)="onTypeFilterChange($event)"
        (sortChange)="onSortChange($event)"
        (reviewScoreChange)="onReviewScoreChange($event)"
      />
    </div>
  </div>
</div>
