<nav class="navbar">
  <div class="navbar-container">
    <!-- Logo -->
    <a class="logo" routerLink="/" aria-label="Sayaf.tn Home">
      <span class="logo-text">Sayaf<span class="dot">.tn</span></span>
    </a>

    <!-- Mobile Menu Toggle -->
    <button
      class="mobile-menu-toggle"
      (click)="toggleMobileMenu()"
      [class.active]="isMobileMenuOpen"
      aria-label="Toggle navigation menu"
      [attr.aria-expanded]="isMobileMenuOpen"
    >
      <span class="hamburger-line"></span>
      <span class="hamburger-line"></span>
      <span class="hamburger-line"></span>
    </button>

    <!-- Navigation Links -->
    <ul class="nav-links" [class.mobile-open]="isMobileMenuOpen">
      <!-- Public Links -->
      <li class="nav-item">
        <a
          routerLink="/"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: true }"
          (click)="closeMobileMenu()"
        >
          <span class="nav-icon">🏠</span>
          <span>Home</span>
        </a>
      </li>
      <li class="nav-item">
        <a
          routerLink="/listings"
          routerLinkActive="active"
          (click)="closeMobileMenu()"
        >
          <span class="nav-icon">🔍</span>
          <span>Discover</span>
        </a>
      </li>

      <!-- Guest Links -->
      <ng-container *ngIf="!authService.isAuthenticated()">
        <li class="nav-item mobile-divider"></li>
        <li class="nav-item">
          <a
            routerLink="/login"
            routerLinkActive="active"
            (click)="closeMobileMenu()"
          >
            Login
          </a>
        </li>
        <li class="nav-item">
          <a
            routerLink="/register"
            routerLinkActive="active"
            class="btn-primary"
            (click)="closeMobileMenu()"
          >
            Sign Up
          </a>
        </li>
      </ng-container>

      <!-- Authenticated User Links -->
      <ng-container *ngIf="authService.isAuthenticated()">
        <li class="nav-item mobile-divider"></li>

        <!-- USER ONLY -->
        <li class="nav-item">
          <a
            routerLink="/add-listing"
            routerLinkActive="active"
            class="nav-highlight"
            (click)="closeMobileMenu()"
          >
            <span class="nav-icon">📝</span>
            <span>Add Listing</span>
          </a>
        </li>

        <!-- Both USER & ADMIN -->
        <li class="nav-item">
          <a
            routerLink="/my-listings"
            routerLinkActive="active"
            (click)="closeMobileMenu()"
          >
            <span class="nav-icon">📋</span>
            <span>My Listings</span>
          </a>
        </li>

        <!-- ADMIN ONLY -->
        <li class="nav-item" *appHasRole="'admin'">
          <a
            routerLink="/dashboard"
            routerLinkActive="active"
            (click)="closeMobileMenu()"
          >
            <span class="nav-icon">🛠️</span>
            <span>Dashboard</span>
          </a>
        </li>

        <!-- ADMIN Dropdown -->
        <li *appHasRole="'admin'" class="nav-item dropdown">
          <button
            class="nav-link dropdown-toggle"
            (click)="toggleDropdown()"
            [class.active]="isDropdownOpen"
            aria-haspopup="true"
            [attr.aria-expanded]="isDropdownOpen"
          >
            <span class="nav-icon">⚙️</span>
            <span>Admin</span>
            <span class="dropdown-arrow">▼</span>
          </button>
          <ul class="dropdown-menu" [class.show]="isDropdownOpen">
            <li>
              <a
                routerLink="/admin/manage-listings"
                (click)="closeDropdown(); closeMobileMenu()"
              >
                <span class="dropdown-icon">📊</span>
                Manage Listings
              </a>
            </li>
            <li>
              <a
                routerLink="/admin/verify-businesses"
                (click)="closeDropdown(); closeMobileMenu()"
              >
                <span class="dropdown-icon">✅</span>
                Verify Businesses
              </a>
            </li>
            <li>
              <a
                routerLink="/admin/users"
                (click)="closeDropdown(); closeMobileMenu()"
              >
                <span class="dropdown-icon">👥</span>
                Manage Users
              </a>
            </li>
          </ul>
        </li>

        <!-- Profile Link -->
        <li class="nav-item">
          <a
            routerLink="/profile"
            routerLinkActive="active"
            (click)="closeMobileMenu()"
          >
            <span class="nav-icon">👤</span>
            <span>Profile</span>
          </a>
        </li>
        <li class="nav-item">
          <a
            (click)="logout(); closeMobileMenu()"
            routerLink="/login"
            routerLinkActive="active"
          >
            <span class="logout-icon">🚪</span>
            <span>Logout</span>
          </a>
        </li>
      </ng-container>
    </ul>
  </div>
</nav>
