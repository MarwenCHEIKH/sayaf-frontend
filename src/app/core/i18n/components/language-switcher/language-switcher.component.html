<!-- src/app/core/i18n/components/language-switcher/language-switcher.component.html -->

<div class="language-switcher" (clickOutside)="closeDropdown()">
  <button
    class="language-button"
    (click)="toggleDropdown()"
    [attr.aria-label]="'common.changeLanguage' | translate"
    aria-haspopup="true"
    [attr.aria-expanded]="isDropdownOpen"
  >
    <!-- Minimalist Globe SVG Icon -->
    <svg
      class="nav-icon"
      width="20"
      height="20"
      viewBox="0 0 24 24"
      fill="none"
      xmlns="http://www.w3.org/2000/svg"
    >
      <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2" />
      <path
        d="M2 12H22"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
      />
      <path
        d="M12 2C14.5 4.5 16 8 16 12C16 16 14.5 19.5 12 22"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
      />
      <path
        d="M12 2C9.5 4.5 8 8 8 12C8 16 9.5 19.5 12 22"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
      />
    </svg>

    <span class="current-lang"
      >{{ currentLanguage$ | async | uppercase }}
    </span>
    <span class="dropdown-arrow" [class.open]="isDropdownOpen">▼</span>
  </button>

  <div class="dropdown-menu" [class.show]="isDropdownOpen">
    <button
      *ngFor="let lang of languages"
      class="dropdown-item"
      [class.active]="lang.code === (currentLanguage$ | async)"
      (click)="switchLanguage(lang.code)"
    >
      <span class="flag">{{ lang.flag }}</span>
      <span class="label">{{ lang.label }}</span>
      <span class="checkmark" *ngIf="lang.code === (currentLanguage$ | async)"
        >✓</span
      >
    </button>
  </div>
</div>
